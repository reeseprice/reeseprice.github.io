<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reese — Full Training Tracker</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Fraunces:ital,wght@0,300;0,600;0,900;1,300;1,600&display=swap');

  :root {
    --bg: #f5f0e8;
    --paper: #faf7f2;
    --ink: #1a1612;
    --ink2: #4a4540;
    --ink3: #8a837a;
    --rule: #d8d0c4;
    --gcp: #1a56db;
    --tf: #7b2ff7;
    --git: #0a7c59;
    --accent: #c2410c;
    --wgu: #b45309;
    --palantir: #be185d;
    --anduril: #0e7490;
    --done-bg: #f0fdf4;
    --done-border: #bbf7d0;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    padding: 32px 16px 100px;
  }

  .wrap { max-width: 960px; margin: 0 auto; }

  /* HEADER */
  header {
    border-bottom: 2px solid var(--ink);
    padding-bottom: 24px;
    margin-bottom: 28px;
  }

  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 16px;
    margin-bottom: 20px;
  }

  .eyebrow { font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink3); margin-bottom: 8px; }

  h1 {
    font-family: 'Fraunces', serif;
    font-size: clamp(1.8rem, 4vw, 3rem);
    font-weight: 900;
    line-height: 1;
  }

  h1 em { font-style: italic; font-weight: 300; color: var(--accent); }

  /* Start date picker */
  .start-row {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .start-label { font-size: 11px; color: var(--ink3); letter-spacing: 0.08em; text-transform: uppercase; }

  .start-input {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    border: 1px solid var(--rule);
    background: var(--paper);
    color: var(--ink);
    padding: 6px 12px;
    border-radius: 2px;
    cursor: pointer;
  }
  .start-input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

  /* Progress bar */
  .progress-wrap {
    margin-top: 16px;
  }
  .progress-meta {
    display: flex;
    justify-content: space-between;
    font-size: 10px;
    color: var(--ink3);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .progress-track {
    height: 6px;
    background: var(--rule);
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--git), var(--gcp));
    border-radius: 3px;
    transition: width 0.4s ease;
  }

  /* LEGEND */
  .legend {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 28px;
  }
  .leg-item { display: flex; align-items: center; gap: 6px; font-size: 10px; color: var(--ink2); letter-spacing: 0.06em; text-transform: uppercase; }
  .leg-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

  /* PHASE BANNER */
  .phase-banner {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 12px 20px;
    background: var(--ink);
    color: var(--bg);
    margin: 28px 0 0;
    cursor: pointer;
    user-select: none;
    transition: opacity 0.2s;
  }
  .phase-banner:hover { opacity: 0.92; }

  .pnum { font-family: 'Fraunces', serif; font-size: 1.8rem; font-weight: 900; color: var(--accent); line-height: 1; }
  .ptitle { font-size: 12px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; }
  .pdesc { font-size: 10px; color: #a09888; margin-top: 2px; }
  .pweeks { margin-left: auto; font-size: 10px; color: #a09888; letter-spacing: 0.06em; text-transform: uppercase; }
  .phase-progress { font-size: 10px; color: #a09888; margin-left: 16px; white-space: nowrap; }
  .toggle-arrow { font-size: 14px; color: #a09888; margin-left: 8px; transition: transform 0.3s; }
  .phase-section.collapsed .toggle-arrow { transform: rotate(-90deg); }

  /* PHASE SECTION */
  .phase-weeks { }
  .phase-section.collapsed .phase-weeks { display: none; }

  /* WEEK ROW */
  .week {
    border-bottom: 1px solid var(--rule);
    transition: background 0.15s;
    position: relative;
  }
  .week.done { background: var(--done-bg); }
  .week.done .week-inner { opacity: 0.7; }

  .week-inner {
    display: grid;
    grid-template-columns: 52px 1fr auto;
    gap: 0;
    align-items: stretch;
  }

  .week-num-col {
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 16px 8px 16px 0;
    border-right: 1px solid var(--rule);
  }

  .wn { font-family: 'Fraunces', serif; font-size: 1.5rem; font-weight: 900; color: var(--rule); line-height: 1; margin-top: 3px; }
  .week.done .wn { color: var(--git); }

  .week-content { padding: 14px 16px; }

  .week-focus { font-family: 'Fraunces', serif; font-size: 0.95rem; font-weight: 600; margin-bottom: 10px; line-height: 1.3; }

  .resources-list { display: flex; flex-direction: column; gap: 5px; margin-bottom: 10px; }

  .resource-item {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .res-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .res-dot.gcp { background: var(--gcp); }
  .res-dot.tf  { background: var(--tf); }
  .res-dot.git { background: var(--git); }
  .res-dot.wgu { background: var(--wgu); }
  .res-dot.palantir { background: var(--palantir); }
  .res-dot.anduril { background: var(--anduril); }

  .res-link {
    font-size: 11px;
    color: var(--ink2);
    text-decoration: none;
    border-bottom: 1px dashed var(--rule);
    transition: color 0.15s, border-color 0.15s;
    line-height: 1.4;
  }
  .res-link:hover { color: var(--accent); border-color: var(--accent); }

  .cost-tag {
    font-size: 9px;
    padding: 1px 6px;
    border-radius: 2px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-weight: 500;
    flex-shrink: 0;
  }
  .cost-tag.free { background: #d1fae5; color: #065f46; }
  .cost-tag.paid { background: #fee2e2; color: #991b1b; }

  .week-note {
    font-size: 10px;
    color: var(--ink3);
    line-height: 1.5;
    border-left: 2px solid var(--rule);
    padding-left: 10px;
    margin-top: 6px;
  }

  .week-meta { display: flex; align-items: center; gap: 8px; margin-top: 8px; flex-wrap: wrap; }

  .hours-badge {
    font-size: 9px;
    color: var(--ink3);
    border: 1px solid var(--rule);
    padding: 2px 8px;
    border-radius: 2px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .milestone-tag {
    font-size: 9px;
    background: var(--accent);
    color: white;
    padding: 2px 8px;
    border-radius: 2px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .week-date {
    font-size: 10px;
    color: var(--ink3);
    letter-spacing: 0.04em;
  }

  /* COMPLETION PANEL */
  .completion-col {
    padding: 14px 16px;
    border-left: 1px solid var(--rule);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    min-width: 140px;
  }

  /* Checkbox */
  .complete-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    cursor: pointer;
    background: none;
    border: none;
    font-family: 'DM Mono', monospace;
    padding: 0;
  }

  .check-box {
    width: 28px;
    height: 28px;
    border: 2px solid var(--rule);
    border-radius: 3px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    transition: all 0.2s;
    background: var(--paper);
  }
  .complete-btn:hover .check-box { border-color: var(--git); }
  .week.done .check-box { border-color: var(--git); background: var(--git); color: white; }

  .check-label { font-size: 9px; color: var(--ink3); letter-spacing: 0.06em; text-transform: uppercase; }
  .week.done .check-label { color: var(--git); }

  /* Date completed */
  .comp-date-wrap { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 100%; }
  .comp-date-label { font-size: 8px; color: var(--ink3); letter-spacing: 0.06em; text-transform: uppercase; }
  .comp-date-input {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    border: 1px solid var(--rule);
    background: var(--paper);
    color: var(--ink);
    padding: 4px 6px;
    border-radius: 2px;
    width: 110px;
    text-align: center;
  }
  .comp-date-input:focus { outline: 1px solid var(--git); }

  /* ETC display */
  .etc-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    width: 100%;
    padding-top: 6px;
    border-top: 1px solid var(--rule);
  }
  .etc-label { font-size: 8px; color: var(--ink3); letter-spacing: 0.06em; text-transform: uppercase; }
  .etc-value { font-size: 11px; color: var(--ink2); font-weight: 500; text-align: center; }

  /* SUMMARY CARDS */
  .summary-cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 12px;
    margin: 36px 0 28px;
    padding: 24px;
    border: 2px solid var(--ink);
    background: var(--paper);
  }

  .stat-card { text-align: center; padding: 12px 8px; border: 1px solid var(--rule); border-radius: 2px; }
  .stat-num { font-family: 'Fraunces', serif; font-size: 2rem; font-weight: 900; color: var(--ink); display: block; line-height: 1; margin-bottom: 6px; }
  .stat-num.green { color: var(--git); }
  .stat-num.orange { color: var(--accent); }
  .stat-label { font-size: 9px; color: var(--ink3); text-transform: uppercase; letter-spacing: 0.08em; }

  /* RESET */
  .reset-btn {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    padding: 6px 16px;
    border: 1px solid var(--rule);
    background: transparent;
    color: var(--ink3);
    cursor: pointer;
    border-radius: 2px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    transition: all 0.2s;
    display: block;
    margin: 0 auto 40px;
  }
  .reset-btn:hover { border-color: var(--accent); color: var(--accent); }
  .sync-dot.synced { background: #10b981 !important; }
  .sync-dot.syncing { background: #f59e0b !important; animation: sdpulse 1s infinite; }
  .sync-dot.error { background: #ef4444 !important; }
  @keyframes sdpulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

  @media (max-width: 640px) {
    .week-inner { grid-template-columns: 40px 1fr; }
    .completion-col { display: none; }
    .week-inner.mobile-open .completion-col { display: flex; grid-column: 1 / -1; border-left: none; border-top: 1px solid var(--rule); }
  }
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="header-top">
    <div>
      <div class="eyebrow">Cloud · WGU · Palantir · Anduril · Full Training Tracker</div>
      <h1>Master <em>Training</em><br>Schedule</h1>
    </div>
    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:10px;">
      <div style="display:flex;align-items:center;gap:6px;font-family:'DM Mono',monospace;font-size:10px;color:var(--ink3);letter-spacing:0.06em;text-transform:uppercase;padding:4px 10px;border:1px solid var(--rule);border-radius:2px;">
        <div id="sync-dot" class="sync-dot syncing" style="width:7px;height:7px;border-radius:50%;background:var(--rule);"></div>
        <span id="sync-txt">Connecting...</span>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;">
        <div class="start-label" style="margin-bottom:6px">Training start date</div>
        <input type="date" class="start-input" id="startDate">
      </div>
    </div>
  </div>
  <div class="progress-wrap">
    <div class="progress-meta">
      <span id="progressLabel">0 of 16 weeks complete</span>
      <span id="progressPct">0%</span>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
  </div>
</header>

<div class="legend">
  <div class="leg-item"><div class="leg-dot" style="background:#1a56db"></div> GCP</div>
  <div class="leg-item"><div class="leg-dot" style="background:#7b2ff7"></div> Terraform</div>
  <div class="leg-item"><div class="leg-dot" style="background:#0a7c59"></div> Git</div>
  <div class="leg-item"><div class="leg-dot" style="background:#b45309"></div> WGU</div>
  <div class="leg-item"><div class="leg-dot" style="background:#be185d"></div> Palantir</div>
  <div class="leg-item"><div class="leg-dot" style="background:#0e7490"></div> Anduril</div>
  <div class="leg-item" style="margin-left:auto">
    <div style="width:10px;height:10px;background:#d1fae5;border:1px solid #a7f3d0;border-radius:2px"></div> Free
    <div style="width:10px;height:10px;background:#fee2e2;border:1px solid #fecaca;border-radius:2px;margin-left:8px"></div> Paid
  </div>
</div>

<!-- ── DATA ──────────────────────────────────────────────────────────── -->
<div id="schedule"></div>

<div class="summary-cards">
  <div class="stat-card">
    <span class="stat-num green" id="statDone">0</span>
    <div class="stat-label">Weeks Done</div>
  </div>
  <div class="stat-card">
    <span class="stat-num" id="statLeft">31</span>
    <div class="stat-label">Weeks Left</div>
  </div>
  <div class="stat-card">
    <span class="stat-num orange" id="statETC">—</span>
    <div class="stat-label">Est. Completion</div>
  </div>
  <div class="stat-card">
    <span class="stat-num" id="statHours">~248h</span>
    <div class="stat-label">Total Hours</div>
  </div>
</div>

<button class="reset-btn" onclick="resetAll()">↺ Reset All Progress</button>

</div><!-- end wrap -->

<script>
const PHASES = [
  {
    num: "01", title: "Foundations", desc: "Git fluency + GCP console navigation", weeks: "Weeks 1–3",
    weeks_data: [
      {
        w: 1, focus: "Git Core: commits, push/pull, GitHub setup", hours: 8,
        resources: [
          { type:"git", label:"GitHub Skills — Introduction to GitHub", url:"https://skills.github.com", cost:"free" },
          { type:"git", label:"learngitbranching.js.org — Main levels 1–4", url:"https://learngitbranching.js.org", cost:"free" }
        ],
        note: "Start at skills.github.com → 'Introduction to GitHub'. Then learngitbranching.js.org for visual branch practice. ~4 hrs each."
      },
      {
        w: 2, focus: "Git Branching, PRs & Merge Conflicts", hours: 8,
        resources: [
          { type:"git", label:"GitHub Skills — Review Pull Requests", url:"https://skills.github.com", cost:"free" },
          { type:"git", label:"learngitbranching.js.org — Ramping Up + Remote levels", url:"https://learngitbranching.js.org", cost:"free" },
          { type:"git", label:"Codecademy — Learn Git & GitHub", url:"https://www.codecademy.com/learn/learn-git", cost:"paid" }
        ],
        note: "Codecademy optional but gives structured graded exercises. GitHub Skills sufficient if budget is tight."
      },
      {
        w: 3, focus: "GCP Core: Projects, IAM, Console & gcloud CLI", hours: 8, milestone: true,
        resources: [
          { type:"gcp", label:"GCP Skills Boost — Google Cloud Fundamentals: Core Infrastructure", url:"https://cloudskillsboost.google/course_templates/60", cost:"free" },
          { type:"gcp", label:"GCP Free Trial — spin up Cloud Shell ($300 credit)", url:"https://cloud.google.com/free", cost:"free" }
        ],
        note: "Create your free trial account this week. The $300 credit has a 90-day clock — activate it now."
      }
    ]
  },
  {
    num: "02", title: "Infrastructure as Code — Terraform", desc: "Define, provision, and version cloud resources declaratively", weeks: "Weeks 4–7",
    weeks_data: [
      {
        w: 4, focus: "Terraform Basics: HCL syntax, init/plan/apply", hours: 8,
        resources: [
          { type:"tf", label:"HashiCorp Learn — Get Started: Google Cloud", url:"https://developer.hashicorp.com/terraform/tutorials/gcp-get-started", cost:"free" },
          { type:"tf", label:"Install Terraform + write first GCP resource", url:"https://developer.hashicorp.com/terraform/install", cost:"free" }
        ],
        note: "Work through every tutorial in the GCP get-started track. Hands-on from day one."
      },
      {
        w: 5, focus: "Terraform Variables, Outputs & State", hours: 8,
        resources: [
          { type:"tf", label:"HashiCorp Learn — Variables & Outputs", url:"https://developer.hashicorp.com/terraform/tutorials/configuration-language", cost:"free" },
          { type:"tf", label:"HashiCorp Learn — Manage Terraform State", url:"https://developer.hashicorp.com/terraform/tutorials/state", cost:"free" },
          { type:"tf", label:"Udemy — Zeal Vora Terraform Associate (Sections 1–5)", url:"https://www.udemy.com/course/terraform-beginner-to-advanced/", cost:"paid" }
        ],
        note: "Udemy course goes deeper on state internals. Buy during a sale — Udemy runs them constantly (~$15)."
      },
      {
        w: 6, focus: "Terraform Modules & Remote State in GCS", hours: 8,
        resources: [
          { type:"tf", label:"HashiCorp Learn — Reuse Configuration with Modules", url:"https://developer.hashicorp.com/terraform/tutorials/modules", cost:"free" },
          { type:"tf", label:"GCP Terraform Provider — google_storage_bucket backend", url:"https://registry.terraform.io/providers/hashicorp/google/latest/docs", cost:"free" },
          { type:"tf", label:"Udemy — Zeal Vora Sections 6–9", url:"https://www.udemy.com/course/terraform-beginner-to-advanced/", cost:"paid" }
        ],
        note: "Bookmark registry.terraform.io/providers/hashicorp/google — everything you build now should use a GCS backend."
      },
      {
        w: 7, focus: "IaC in Git: repo structure, .gitignore, PR workflow", hours: 8, milestone: true,
        resources: [
          { type:"tf", label:"HashiCorp Learn — Terraform Cloud intro", url:"https://developer.hashicorp.com/terraform/tutorials/cloud-get-started", cost:"free" },
          { type:"git", label:"GitHub Skills — GitHub Actions: Automate workflows", url:"https://skills.github.com", cost:"free" },
          { type:"tf", label:"tflint linter setup", url:"https://github.com/terraform-linters/tflint", cost:"free" }
        ],
        note: "Build a Terraform repo in GitHub with a proper .gitignore (add .terraform/ and *.tfstate). Set up terraform fmt as a pre-commit hook."
      }
    ]
  },
  {
    num: "03", title: "GCP Deep Dive & CI/CD", desc: "Containers, networking, pipelines, observability", weeks: "Weeks 8–11",
    weeks_data: [
      {
        w: 8, focus: "Docker + Artifact Registry + GKE Intro", hours: 10,
        resources: [
          { type:"gcp", label:"Docker — Official Get Started Tutorial", url:"https://docs.docker.com/get-started/", cost:"free" },
          { type:"gcp", label:"GCP Skills Boost — Kubernetes in Google Cloud quest", url:"https://cloudskillsboost.google/quests/29", cost:"free" }
        ],
        note: "Docker Get Started takes ~3 hrs. Then Skills Boost Kubernetes quest for GKE content. Push your first container image to Artifact Registry."
      },
      {
        w: 9, focus: "GCP Networking: VPC, Load Balancers, Cloud NAT", hours: 8,
        resources: [
          { type:"gcp", label:"GCP Skills Boost — Networking in Google Cloud", url:"https://cloudskillsboost.google/course_templates/35", cost:"free" },
          { type:"gcp", label:"A Cloud Guru — GCP networking module (optional)", url:"https://acloudguru.com", cost:"paid" }
        ],
        note: "Networking trips up most beginners. Draw your VPC diagrams by hand — it cements concepts faster than any video."
      },
      {
        w: 10, focus: "CI/CD: GitHub Actions + Cloud Build + OIDC Auth", hours: 10,
        resources: [
          { type:"git", label:"GitHub Docs — Actions workflow syntax", url:"https://docs.github.com/en/actions/writing-workflows/workflow-syntax-for-github-actions", cost:"free" },
          { type:"gcp", label:"GCP Docs — Workload Identity Federation (OIDC)", url:"https://cloud.google.com/iam/docs/workload-identity-federation", cost:"free" },
          { type:"gcp", label:"GCP Skills Boost — CI/CD Pipelines on Google Cloud", url:"https://cloudskillsboost.google/course_templates/691", cost:"free" }
        ],
        note: "OIDC keyless auth (no stored service account keys) is current best practice. This week is dense — plan a full 10 hours."
      },
      {
        w: 11, focus: "Observability, Security & Secret Manager", hours: 8, milestone: true,
        resources: [
          { type:"gcp", label:"GCP Skills Boost — Monitor and Log with Google Cloud Observability", url:"https://cloudskillsboost.google/course_templates/749", cost:"free" },
          { type:"gcp", label:"GCP Docs — Secret Manager quickstart", url:"https://cloud.google.com/secret-manager/docs/quickstart", cost:"free" }
        ],
        note: "Connect Secret Manager to your Terraform configs and CI/CD pipeline. Set up a Cloud Monitoring alert for VM CPU — common interview demo topic."
      }
    ]
  },
  {
    num: "04", title: "Team Integration & Capstone", desc: "Real-world workflows, cert prep, portfolio project", weeks: "Weeks 12–16",
    weeks_data: [
      {
        w: 12, focus: "Advanced Git: rebasing, cherry-pick, signed commits, branch protection", hours: 6,
        resources: [
          { type:"git", label:"learngitbranching.js.org — Advanced levels", url:"https://learngitbranching.js.org", cost:"free" },
          { type:"git", label:"GitHub Docs — Branch protection rules", url:"https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/managing-protected-branches/about-protected-branches", cost:"free" },
          { type:"git", label:"GitHub Docs — Requiring signed commits", url:"https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/managing-protected-branches/about-protected-branches#require-signed-commits", cost:"free" }
        ],
        note: "Set up branch protection on your capstone repo: require PR reviews, status checks, and signed commits — mirrors real team workflow."
      },
      {

// ── FIREBASE STATE ───────────────────────────────────────────────────────
let state = { startDate: '', weeks: {} };
let _db = null;
let _docRef = null;
let _pendingWrite = null;

function setSyncUI(status) {
  const dot = document.getElementById('sync-dot');
  const txt = document.getElementById('sync-txt');
  if (!dot || !txt) return;
  dot.className = 'sync-dot ' + status;
  const labels = { synced: 'Synced', syncing: 'Syncing...', error: 'Offline — saved locally' };
  txt.textContent = labels[status] || status;
}

function saveState() {
  setSyncUI('syncing');
  if (_pendingWrite) clearTimeout(_pendingWrite);
  _pendingWrite = setTimeout(async () => {
    if (_db && _docRef) {
      try {
        const { setDoc } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js");
        await setDoc(_docRef, state);
        setSyncUI('synced');
      } catch(e) {
        setSyncUI('error');
        try { localStorage.setItem('tracker_fallback', JSON.stringify(state)); } catch(e2) {}
      }
    } else {
      try { localStorage.setItem('tracker_fallback', JSON.stringify(state)); } catch(e) {}
    }
  }, 600);
}

async function loadState() {
  try {
    const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js");
    const { getFirestore, doc, onSnapshot } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js");
    const { setDoc } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js");
    const firebaseConfig = {
      apiKey: "AIzaSyDjfRzuRxxoxtRJdQzklKq0l-zrFeQ19GI",
      authDomain: "cp-training-hub.firebaseapp.com",
      projectId: "cp-training-hub",
      storageBucket: "cp-training-hub.firebasestorage.app",
      messagingSenderId: "665937146753",
      appId: "1:665937146753:web:f8b48ffe1ab76fc76aae80"
    };
    const app = initializeApp(firebaseConfig, "tracker");
    _db = getFirestore(app);
    _docRef = doc(_db, "progress", "tracker");
    onSnapshot(_docRef, (snap) => {
      if (snap.exists()) {
        const data = snap.data();
        state = { startDate: data.startDate || '', weeks: data.weeks || {} };
        const startInput = document.getElementById('startDate');
        if (startInput && state.startDate) startInput.value = state.startDate;
      }
      setSyncUI('synced');
      render();
    }, () => {
      setSyncUI('error');
      try { const fb = localStorage.getItem('tracker_fallback'); if (fb) state = JSON.parse(fb); } catch(e) {}
      render();
    });
  } catch(e) {
    setSyncUI('error');
    try { const fb = localStorage.getItem('tracker_fallback'); if (fb) state = JSON.parse(fb); } catch(e2) {}
    render();
  }
}

// ── DATES ────────────────────────────────────────────────────────────
function parseDate(s) {
  if (!s) return null;
  const [y,m,d] = s.split('-').map(Number);
  return new Date(y, m-1, d);
}

function formatDate(d) {
  if (!d) return '—';
  return d.toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });
}

function addWeeks(date, n) {
  const d = new Date(date);
  d.setDate(d.getDate() + n * 7);
  return d;
}

function weekStartDate(weekNum) {
  if (!state.startDate) return null;
  const base = parseDate(state.startDate);
  if (!base) return null;
  return addWeeks(base, weekNum - 1);
}

function weekEndDate(weekNum) {
  const s = weekStartDate(weekNum);
  if (!s) return null;
  return addWeeks(s, 1);
}

// ── RENDER ───────────────────────────────────────────────────────────
function render() {
  const container = document.getElementById('schedule');
  container.innerHTML = '';

  PHASES.forEach((phase, pi) => {
    // Phase banner
    const banner = document.createElement('div');
    banner.className = 'phase-banner';
    banner.id = `phase-${pi}`;

    const doneInPhase = phase.weeks_data.filter(w => state.weeks[w.w]?.done).length;
    const totalInPhase = phase.weeks_data.length;

    banner.innerHTML = `
      <div class="pnum">${phase.num}</div>
      <div class="pinfo">
        <div class="ptitle">${phase.title}</div>
        <div class="pdesc">${phase.desc}</div>
      </div>
      <div class="phase-progress">${doneInPhase}/${totalInPhase}</div>
      <div class="pweeks">${phase.weeks}</div>
      <div class="toggle-arrow">▾</div>
    `;

    const section = document.createElement('div');
    section.className = 'phase-section';
    section.id = `section-${pi}`;

    banner.addEventListener('click', () => {
      section.classList.toggle('collapsed');
    });

    const weeksDiv = document.createElement('div');
    weeksDiv.className = 'phase-weeks';

    phase.weeks_data.forEach(wd => {
      const ws = state.weeks[wd.w] || {};
      const isDone = !!ws.done;

      const week = document.createElement('div');
      week.className = 'week' + (isDone ? ' done' : '');
      week.id = `week-${wd.w}`;

      const startD = weekStartDate(wd.w);
      const endD = weekEndDate(wd.w);
      const dateStr = startD ? `${formatDate(startD)} – ${formatDate(endD)}` : 'Set start date above';

      const resourcesHTML = wd.resources.map(r => `
        <div class="resource-item">
          <div class="res-dot ${r.type}"></div>
          <a class="res-link" href="${r.url}" target="_blank" rel="noopener">${r.label}</a>
          <span class="cost-tag ${r.cost}">${r.cost === 'free' ? 'Free' : 'Paid'}</span>
        </div>
      `).join('');

      const compDateVal = ws.compDate || '';

      week.innerHTML = `
        <div class="week-inner">
          <div class="week-num-col">
            <div class="wn">${wd.w}</div>
          </div>
          <div class="week-content">
            <div class="week-focus">${wd.focus}</div>
            <div class="resources-list">${resourcesHTML}</div>
            <div class="week-note">${wd.note}</div>
            <div class="week-meta">
              <span class="hours-badge">~${wd.hours} hrs</span>
              ${wd.milestone ? '<span class="milestone-tag">🏁 Milestone</span>' : ''}
              <span class="week-date">${dateStr}</span>
            </div>
          </div>
          <div class="completion-col">
            <button class="complete-btn" onclick="toggleDone(${wd.w})">
              <div class="check-box">${isDone ? '✓' : ''}</div>
              <div class="check-label">${isDone ? 'Complete' : 'Mark done'}</div>
            </button>
            <div class="comp-date-wrap">
              <div class="comp-date-label">Date completed</div>
              <input type="date" class="comp-date-input" value="${compDateVal}" onchange="setCompDate(${wd.w}, this.value)" placeholder="yyyy-mm-dd">
            </div>
            <div class="etc-wrap">
              <div class="etc-label">Target week</div>
              <div class="etc-value">${startD ? formatDate(endD) : '—'}</div>
            </div>
          </div>
        </div>
      `;

      weeksDiv.appendChild(week);
    });

    section.appendChild(weeksDiv);
    container.appendChild(banner);
    container.appendChild(section);
  });

  updateStats();
}

function toggleDone(weekNum) {
  if (!state.weeks[weekNum]) state.weeks[weekNum] = {};
  state.weeks[weekNum].done = !state.weeks[weekNum].done;
  if (state.weeks[weekNum].done && !state.weeks[weekNum].compDate) {
    state.weeks[weekNum].compDate = new Date().toISOString().split('T')[0];
  }
  saveState();
  render();
}

function setCompDate(weekNum, val) {
  if (!state.weeks[weekNum]) state.weeks[weekNum] = {};
  state.weeks[weekNum].compDate = val;
  saveState();
  // Don't re-render to avoid losing focus — just update stats
  updateStats();
}

function updateStats() {
  const allWeeks = PHASES.flatMap(p => p.weeks_data);
  const total = allWeeks.length;
  const done = allWeeks.filter(w => state.weeks[w.w]?.done).length;
  const left = total - done;
  const pct = Math.round((done / total) * 100);

  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressLabel').textContent = `${done} of ${total} weeks complete`;
  document.getElementById('progressPct').textContent = pct + '%';
  document.getElementById('statDone').textContent = done;
  document.getElementById('statLeft').textContent = left;

  // ETC: based on start date + total weeks
  if (state.startDate) {
    const base = parseDate(state.startDate);
    const etc = addWeeks(base, total);
    document.getElementById('statETC').textContent = formatDate(etc);
  }

  const totalHours = allWeeks.reduce((sum, w) => {
    if (!state.weeks[w.w]?.done) return sum + w.hours;
    return sum;
  }, 0);
  document.getElementById('statHours').textContent = `~${totalHours}h left`;
}

function resetAll() {
  if (!confirm('Reset all progress? This cannot be undone.')) return;
  state.weeks = {};
  saveState();
  render();
}

// ── INIT ─────────────────────────────────────────────────────────────
const startInput = document.getElementById('startDate');

startInput.addEventListener('change', e => {
  state.startDate = e.target.value;
  saveState();
  render();
});

loadState();
</script>
